name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install plugin dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Syntax-check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --check bin/dsh-purge.js
          node --input-type=module -e "import './lib/index.js'"

      - name: Runtime regressions
        run: npm run check:runtime

      - name: Validate declared host compatibility
        run: |
          set -euo pipefail
          target="$(node -p "require('./package.json').dshTarget")"
          npm install -g "@deepseek-ai/dsh@$target" --no-audit --no-fund
          AI_BASE="$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai"
          node bin/dsh-purge.js --check --base "$AI_BASE"
          DSH_AI_BASE="$AI_BASE" npm run check:prompt

      - name: Test archive handoff under real Electron
        run: |
          set -euo pipefail
          target="$(node -p "require('./package.json').dshElectronTarget")"
          npm install --prefix "$RUNNER_TEMP/purge-electron" "electron@$target" --no-audit --no-fund
          node "$RUNNER_TEMP/purge-electron/node_modules/electron/install.js"
          DSH_ELECTRON_BIN="$RUNNER_TEMP/purge-electron/node_modules/electron/dist/electron" npm run check:desktop

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "release-notes.md 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi
          zip="dsh-purge-${version}.zip"
          # 始终从触发本次 push 的 commit 打包，不依赖 tag 是否已预存。
          # 原逻辑在 tag 预先存在时会取 refs/tags/<tag> 指向的旧 commit，
          # 打出与本次改动不一致的产物。
          commit="$GITHUB_SHA"
          git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" "$commit"
          if gh release view "$tag" >/dev/null 2>&1; then
            # 已发布：更新说明并覆盖资产，不改动 release 的 target。
            echo "release exists: $tag — 更新说明并覆盖资产"
            gh release edit "$tag" --notes-file release-notes.md
          else
            args=(release create "$tag" --title "$tag" --notes-file release-notes.md)
            case "$version" in
              *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
            esac
            if git rev-parse -q --verify "refs/tags/${tag}^{}" >/dev/null; then
              gh "${args[@]}"
            else
              args+=(--target "$GITHUB_SHA")
              gh "${args[@]}"
            fi
          fi
          test -s "$zip"
          gh release upload "$tag" "$zip" --clobber
          echo "published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
